<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar intervenção | Atitudinal</title>
    <link rel="stylesheet" href="../css/styles.css" />
  </head>

  <body>
    <header class="topo">
      <a class="marca" href="../index.html">
        <span class="marca-icone">a.</span>
        Atitudinal
      </a>

      <span class="topo-texto"> Núcleo pedagógico </span>
    </header>

    <main class="area-conteudo">
      <div class="conteudo limite-medio">
        <div class="cabecalho-pagina">
          <div class="cabecalho-texto">
            <p class="subtitulo">
              <a href="intervencoes.html">Intervenções</a>
              / Novo registro
            </p>

            <h1>Registrar intervenção</h1>

            <p>Registre a ação realizada e a data de revisão.</p>
          </div>
        </div>

        <section class="caixa">
          <form action="intervencao-sucesso.html" class="coluna" method="get">
            <div class="formulario-grade">
              <div class="campo">
                <label for="estudante"> Estudante </label>

                <select id="estudante" required>
                  <option>Lucas Fernandes · 8º A</option>
                  <option>Ana Souza · 8º B</option>
                  <option>Mariana Oliveira · 8º A</option>
                </select>
              </div>

              <div class="campo">
                <label for="tipo"> Tipo de ação </label>

                <select id="tipo" required>
                  <option>Conversa individual</option>
                  <option>Reunião pedagógica</option>
                  <option>Acompanhamento</option>
                  <option>Contato com responsável</option>
                  <option>Encaminhamento ao núcleo</option>
                </select>
              </div>

              <div class="campo completo">
                <label for="combinado"> Descrição e próximos passos </label>

                <textarea
                  id="combinado"
                  placeholder="Descreva a ação realizada e quando será revisada."
                  required
                ></textarea>
              </div>

              <div class="campo">
                <label for="responsavel"> Pessoa responsável </label>

                <input
                  id="responsavel"
                  type="text"
                  value="Helena Costa"
                  required
                />
              </div>

              <div class="campo">
                <label for="revisao"> Data de revisão </label>

                <input id="revisao" type="date" required />
              </div>
            </div>

            <div class="linha">
              <button class="botao" type="submit">Registrar intervenção</button>

              <a class="botao-link" href="intervencoes.html"> Cancelar </a>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
